<ion-content>
  <div class="screen frame-order-screen">
    <ui-utils-page-header
      group="frame"
      title="Frame Order"
      description="Seleziona un atlas di eroe o mostro, riordina i frame con drag and drop e scorri la preview seguendo l'ordine scelto."
    />

    <section class="toolbar">
      <label>
        Atlas sprite
        <select [(ngModel)]="selectedAtlasId" (ngModelChange)="onAtlasChange($event)">
          <option *ngFor="let atlas of atlasOptions" [value]="atlas.id">{{ atlas.label }}</option>
        </select>
      </label>

      <label>
        Formato preview
        <select [value]="selectedPreviewFormatId" (change)="onPreviewFormatChange($any($event.target).value)">
          <option *ngFor="let option of previewFormatOptions" [value]="option.id">{{ option.label }}</option>
        </select>
      </label>

      <div class="toolbar-actions">
        <button type="button" (click)="moveSelected(-1)">Sposta su</button>
        <button type="button" (click)="moveSelected(1)">Sposta giù</button>
        <button type="button" (click)="resetOrder()">Reset ordine</button>
        <button type="button" (click)="renameSpritesByCurrentPosition()">Rinomina sprite per posizione</button>
        <button type="button" (click)="copyUpdatedAtlasToClipboard()">Copia atlas aggiornato</button>
      </div>
    </section>

    <section class="workspace">
      <aside class="frame-list-panel">
        <h2>Lista ordinabile ({{ frames.length }} frame)</h2>
        <ol class="frame-list">
          <li
            *ngFor="let frame of frames; let index = index"
            draggable="true"
            [class.active]="frame.name === selectedFrameName"
            [class.dragging]="frame.name === draggedFrameName"
            (click)="selectFrame(frame.name)"
            (dragstart)="onDragStart(frame.name)"
            (dragover)="onDragOver($event)"
            (drop)="onDrop(frame.name)"
          >
            <span class="drag-handle">↕</span>
            <span class="index">{{ index + 1 }}</span>
            <span class="name">{{ frame.name }}</span>
            <span class="size">{{ frame.w }}×{{ frame.h }}</span>
          </li>
        </ol>
      </aside>

      <main class="preview-panel">
        <div class="preview-card">
          <button type="button" class="arrow" (click)="previousFrame()" aria-label="Frame precedente">‹</button>
          <div class="sprite-stage">
            <div class="sprite-viewport" [ngStyle]="getSpriteViewportStyle()">
              <div class="sprite-preview" [ngStyle]="getSpriteStyle(selectedFrame)"></div>
            </div>
          </div>
          <button type="button" class="arrow" (click)="nextFrame()" aria-label="Frame successivo">›</button>
        </div>

        <div class="selected-info" *ngIf="selectedFrame as frame">
          <h2>{{ selectedIndex + 1 }}. {{ frame.name }}</h2>
          <p>x: {{ frame.x }} · y: {{ frame.y }} · w: {{ frame.w }} · h: {{ frame.h }}</p>
        </div>

        <label class="output">
          Atlas aggiornato
          <textarea readonly [value]="updatedAtlasText"></textarea>
        </label>
      </main>
    </section>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ui-bottom-utils />
  </ion-toolbar>
</ion-footer>
