<ion-content>
  <div class="screen frame-test-screen">
    <ui-utils-page-header
      group="frame"
      title="Frame Test"
      description="Riproduci le azioni di eroi e mostri come nel gioco: movimento direzionale, attacco, parata e speciale."
    />

    <section class="workspace">
      <aside class="control-panel">
        <h2>Sprite atlas</h2>
        <label>
          Set sprite
          <select [(ngModel)]="selectedSetId" (ngModelChange)="onAtlasSetChange()">
            <option *ngFor="let set of atlasSets" [value]="set.id">{{ set.label }}</option>
          </select>
        </label>

        <label>
          Azione selezionata
          <select [(ngModel)]="selectedAction" (ngModelChange)="onActionChange()">
            <option *ngFor="let action of actions" [value]="action.id">{{ action.label }} ({{ action.prefix }})</option>
          </select>
        </label>

        <h2>Frame sequence</h2>
        <div class="grid two-cols">
          <label>Start <input type="number" min="0" [(ngModel)]="actionConfigs[selectedAction].start" (ngModelChange)="applyConfig()" /></label>
          <label>End <input type="number" min="0" [(ngModel)]="actionConfigs[selectedAction].end" (ngModelChange)="applyConfig()" /></label>
          <label>Zero pad <input type="number" min="0" max="8" [(ngModel)]="config.zeroPad" (ngModelChange)="applyConfig()" /></label>
          <label>Suffisso <input type="text" [(ngModel)]="config.suffix" (ngModelChange)="applyConfig()" /></label>
        </div>

        <h2>Parametri animazione</h2>
        <div class="grid two-cols">
          <label>Frame rate <input type="number" min="1" [(ngModel)]="actionConfigs[selectedAction].frameRate" (ngModelChange)="applyConfig()" /></label>
          <label>Duration (ms) <input type="number" min="0" [(ngModel)]="actionConfigs[selectedAction].duration" (ngModelChange)="applyConfig()" /></label>
          <label>Delay (ms) <input type="number" min="0" [(ngModel)]="actionConfigs[selectedAction].delay" (ngModelChange)="applyConfig()" /></label>
          <label>Repeat azione
            <select [(ngModel)]="actionConfigs[selectedAction].repeat" (ngModelChange)="applyConfig()">
              <option *ngFor="let option of repeatPresets" [ngValue]="option.value">{{ option.label }}</option>
            </select>
          </label>
          <label>Repeat delay (ms) <input type="number" min="0" [(ngModel)]="actionConfigs[selectedAction].repeatDelay" (ngModelChange)="applyConfig()" /></label>
          <label>Velocità movimento <input type="number" min="30" [(ngModel)]="config.movementSpeed" (ngModelChange)="applyConfig()" /></label>
        </div>

        <div class="checkbox-grid">
          <label><input type="checkbox" [(ngModel)]="config.yoyo" (ngModelChange)="applyConfig()" /> Yoyo</label>
          <label><input type="checkbox" [(ngModel)]="config.showOnStart" (ngModelChange)="applyConfig()" /> Show on start</label>
          <label><input type="checkbox" [(ngModel)]="config.hideOnComplete" (ngModelChange)="applyConfig()" /> Hide on complete</label>
          <label><input type="checkbox" [(ngModel)]="config.skipMissedFrames" (ngModelChange)="applyConfig()" /> Skip missed frames</label>
        </div>

        <h2>Sprite preview</h2>
        <div class="grid two-cols">
          <label>Scala <input type="number" min="0.1" step="0.1" [(ngModel)]="config.scale" (ngModelChange)="applyConfig()" /></label>
          <label>Rotazione <input type="number" step="1" [(ngModel)]="config.angle" (ngModelChange)="applyConfig()" /></label>
          <label>Origin X <input type="number" min="0" max="1" step="0.05" [(ngModel)]="config.originX" (ngModelChange)="applyConfig()" /></label>
          <label>Origin Y <input type="number" min="0" max="1" step="0.05" [(ngModel)]="config.originY" (ngModelChange)="applyConfig()" /></label>
        </div>

        <h2>Viewport</h2>
        <div class="grid two-cols">
          <label>Larghezza <input type="number" min="240" [(ngModel)]="config.previewWidth" (ngModelChange)="applyConfig()" /></label>
          <label>Altezza <input type="number" min="240" [(ngModel)]="config.previewHeight" (ngModelChange)="applyConfig()" /></label>
        </div>
      </aside>

      <main class="preview-panel">
        <section class="phaser-shell">
          <div #phaserContainer class="phaser-container"></div>
        </section>

        <section class="hud-help-panel">
          <h2>HUD Phaser</h2>
          <p>Usa il joystick e i pulsanti dentro il canvas Phaser per testare gli stessi input del gioco principale.</p>
        </section>

        <section class="code-panel">
          <div class="panel-title-row">
            <h2>Codice applicazione parametri</h2>
            <button type="button" (click)="copyCodeToClipboard()">Copia codice</button>
          </div>
          <textarea readonly [value]="generatedCode"></textarea>
        </section>
      </main>
    </section>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ui-bottom-utils />
  </ion-toolbar>
</ion-footer>
