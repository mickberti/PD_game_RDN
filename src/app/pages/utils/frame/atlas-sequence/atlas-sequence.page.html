<ion-content>
  <div class="screen atlas-sequence-screen">
    <ui-utils-page-header
      group="frame"
      title="Atlas Sequence"
      description="Visualizza in loop una sequenza dell'atlas scegliendo set, azione e orientamento."
    />

    <section class="workspace">
      <aside class="control-panel">
        <h2>Sequenza</h2>

        <label>
          Set sprite
          <select [(ngModel)]="selectedSetId" (ngModelChange)="applySelection()">
            <option *ngFor="let set of atlasSets" [value]="set.id">{{ set.label }}</option>
          </select>
        </label>

        <label>
          Sequenza
          <select [(ngModel)]="selectedAction" (ngModelChange)="applySelection()">
            <option *ngFor="let action of actions" [value]="action.id">{{ action.label }}</option>
          </select>
        </label>

        <label>
          Orientamento
          <select [(ngModel)]="selectedOrientation" (ngModelChange)="applySelection()">
            <option *ngFor="let orientation of orientations" [value]="orientation.id">{{ orientation.label }}</option>
          </select>
        </label>

        <p>La sequenza selezionata viene riprodotta continuamente nell'anteprima.</p>
      </aside>

      <main class="preview-panel">
        <section class="phaser-shell">
          <div #phaserContainer class="phaser-container"></div>
        </section>
      </main>
    </section>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ui-bottom-utils />
  </ion-toolbar>
</ion-footer>
